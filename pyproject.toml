[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio_lead_ds"
version = "1.0.0"
description = "Pipeline de Corrección de Pronóstico de Demanda y Optimización Logística B2B"
authors = [
    { name = "Isabel Rivadero", email = "isabel.rivadero@recursiva.global" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "shap>=0.42.0",
    "matplotlib>=3.7.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]