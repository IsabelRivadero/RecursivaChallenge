paths:
  raw_pedidos: "data/raw/pedidos_historicos_genericos.csv"
  raw_pronostico: "data/raw/pronostico_demanda_generico.csv"
  raw_capacidad: "data/raw/capacidad_logistica_generica.csv"
  raw_plan: "data/raw/plan_entrega_clientes_generico.csv"
  processed_dir: "data/processed/"

model:
  min_history_days: 45
  lags: [1, 2, 3, 7, 14]
  rolling_windows: [7, 14, 21]
  random_state: 42
  max_iter: 100

features:
  cols:
    - unidades_pronosticadas
    - dia_semana
    - es_fin_semana
    - dia_mes
    - lag_1
    - lag_2
    - lag_3
    - lag_7
    - lag_14
    - rolling_mean_7
    - rolling_std_7
    - rolling_max_7
    - rolling_mean_14
    - rolling_std_14
    - rolling_max_14
    - rolling_mean_21
    - rolling_std_21
    - rolling_max_21